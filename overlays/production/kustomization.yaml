apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base

namePrefix: prod-

commonLabels:
  app.kubernetes.io/environment: production

images:
- name: quay.io/redhattraining/exoplanets
  newTag: v1.0

replicas:
- name: user-service
  count: 3

configMapGenerator:
- name: user-service-config
  behavior: merge
  literals:
  - LOG_LEVEL=WARN

patches:
- path: resource-limits.yaml

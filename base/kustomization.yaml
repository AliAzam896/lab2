apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- deployment.yaml
- database-service.yaml

configMapGenerator:
- name: user-service-config
  literals:
  - DB_HOST=wrong-database-service
  - DB_PORT=5432
  - DB_USER=exoplanets
  - DB_PASSWORD=apppassword
  - DB_NAME=exoplanets
  - DB_SSLMODE=disable
  - LOG_LEVEL=INFO

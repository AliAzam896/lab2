apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  labels:
    app: user-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
      - name: user-service
        image: quay.io/openshift/origin-hello-openshift:latest
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: user-service-config
